      <p>16 堂課、104 句講師金句。早會分享、面談話術、朋友圈文案，隨取隨用；點來源可回到原筆記。</p>

    <main class="grid" id="grid">
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>真正的長壽，不只是活得久，而是活得健康。</blockquote>
        <figcaption>壽命不是唯一指標，健康壽命才決定晚年品質。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>未來最大的風險，不一定是死得太早，而是活得太久、病得太久。</blockquote>
        <figcaption>長壽會同時放大退休、醫療與照護缺口。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>健康，是人生報酬率最高的一項投資。</blockquote>
        <figcaption>睡眠、飲食、運動與檢查，都是日常資產配置。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>醫療正在從治療疾病，走向管理健康。</blockquote>
        <figcaption>科技讓健康管理從被動反應，轉為主動預防。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>你的生理年齡，不一定等於身分證上的年齡。</blockquote>
        <figcaption>未來健康評估會更重視個人數據與功能狀態。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="尹燁">
        <blockquote>財富規劃的終點，不是資產最大化，而是人生選擇權最大化。</blockquote>
        <figcaption>有健康、有現金流，才有真正的自由。</figcaption>
        <a class="src" href="notes/d5-01-baishidai-yinye.html">尹燁｜百歲時代</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>在事業的戰場上，誰的我最大，誰就是第一責任人。</blockquote>
        <figcaption>不要把結果交給環境，先把主動權拿回來。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>人是沒有辦法計畫故事的，但真實的人生會長出故事。</blockquote>
        <figcaption>最有力量的內容，往往不是包裝，而是真實。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>你所看到的，都是我想讓你看到的。</blockquote>
        <figcaption>自媒體不是隨手發，而是設計外界如何理解你。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>每一個時代，都有這個時代的呈現方式和創業機會。</blockquote>
        <figcaption>方法會變，價值不變；不變的人會被時代留在原地。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>所有的成功，都是被設計的。</blockquote>
        <figcaption>結果不是只靠努力，而是靠努力加上結構化設計。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="張一凡">
        <blockquote>流量不是目的，流量只是信任被看見的入口。</blockquote>
        <figcaption>保險人要追的不是熱度，而是可信度。</figcaption>
        <a class="src" href="notes/d5-02-zhangyifan.html">張一凡｜自媒體事件營銷</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>目標是給客戶設定的；給他一個目標，他就會努力達成。</blockquote>
        <figcaption>從「推產品」改成「陪客戶完成家庭配置目標」。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>小單打天下，件數定江山，做多才能做大。</blockquote>
        <figcaption>大量單不是低價值，而是信任複利的起點。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>拒絕是常態，N 次拒絕等於成功。</blockquote>
        <figcaption>拒絕不是結束，而是長期經營的一部分。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>情誼無價，服務無價；成交是客戶，不成交是朋友。</blockquote>
        <figcaption>成交之前先做人，服務之後才有加保與轉介紹。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>最好的銷售是簽單，最好的經營是加保。</blockquote>
        <figcaption>簽單只是開始，加保才代表關係與需求持續被照顧。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="褚東東">
        <blockquote>大單不是等出來的，市場是服務出來的。</blockquote>
        <figcaption>與其等待完美高客，不如把每個入口經營成長期關係。</figcaption>
        <a class="src" href="notes/d5-03-chudongdong.html">褚東東｜壽險常青樹：高淨值銷售</a>
      </figure>
      <figure class="q" data-d="d1" data-s="余巧琴">
        <blockquote>有錢人在規劃三代，沒錢人在規劃週末。</blockquote>
        <figcaption>高客不是只看眼前收益，而是看家族長期安全。</figcaption>
        <a class="src" href="notes/d5-04-yuqiaoqin.html">余巧琴｜家辦思維撬動超高淨值</a>
      </figure>
      <figure class="q" data-d="d1" data-s="余巧琴">
        <blockquote>做對的事情，再把事情做對。</blockquote>
        <figcaption>先選對賽道，再談方法、效率與複製。</figcaption>
        <a class="src" href="notes/d5-04-yuqiaoqin.html">余巧琴｜家辦思維撬動超高淨值</a>
      </figure>
      <figure class="q" data-d="d1" data-s="余巧琴">
        <blockquote>高淨值客戶買的不是保單，是家族風險防火牆。</blockquote>
        <figcaption>顧問要把商品語言轉成家族安全語言。</figcaption>
        <a class="src" href="notes/d5-04-yuqiaoqin.html">余巧琴｜家辦思維撬動超高淨值</a>
      </figure>
      <figure class="q" data-d="d1" data-s="余巧琴">
        <blockquote>最大風險不是風險本身，而是來不及規劃。</blockquote>
        <figcaption>高客教育的切入點，是讓風險被提前看見。</figcaption>
        <a class="src" href="notes/d5-04-yuqiaoqin.html">余巧琴｜家辦思維撬動超高淨值</a>
      </figure>
      <figure class="q" data-d="d1" data-s="余巧琴">
        <blockquote>以客戶家族全生命週期安全為唯一中心。</blockquote>
        <figcaption>家辦顧問的核心不是炫技，而是長期守護。</figcaption>
        <a class="src" href="notes/d5-04-yuqiaoqin.html">余巧琴｜家辦思維撬動超高淨值</a>
      </figure>
      <figure class="q" data-d="d1" data-s="國旭">
        <blockquote>創富固然艱辛，守富更需要智慧。</blockquote>
        <figcaption>企業家不是只需要賺錢能力，也需要風險結構。</figcaption>
        <a class="src" href="notes/d5-05-guoxu.html">國旭｜家企風險隔離</a>
      </figure>
      <figure class="q" data-d="d1" data-s="國旭">
        <blockquote>春風得意的時候做規劃，四面楚歌的時候才有路。</blockquote>
        <figcaption>危機爆發後，很多工具已經不能補做。</figcaption>
        <a class="src" href="notes/d5-05-guoxu.html">國旭｜家企風險隔離</a>
      </figure>
      <figure class="q" data-d="d1" data-s="國旭">
        <blockquote>財富保全與傳承，要提前計畫、同步規劃。</blockquote>
        <figcaption>保全時要想能否傳下去，傳承時要想能否保得住。</figcaption>
        <a class="src" href="notes/d5-05-guoxu.html">國旭｜家企風險隔離</a>
      </figure>
      <figure class="q" data-d="d1" data-s="國旭">
        <blockquote>工具不會離婚、不會欠債，也不會有人性問題。</blockquote>
        <figcaption>這是保單、信託等制度化工具相對代持的價值。</figcaption>
        <a class="src" href="notes/d5-05-guoxu.html">國旭｜家企風險隔離</a>
      </figure>
      <figure class="q" data-d="d1" data-s="國旭">
        <blockquote>不靠天賜的運氣活著，而靠策劃的運氣發達。</blockquote>
        <figcaption>講師以洛克斐勒名言作為規劃精神的總結。</figcaption>
        <a class="src" href="notes/d5-05-guoxu.html">國旭｜家企風險隔離</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>銷售的第一步，不是讓客戶買單，而是讓客戶記住你。</blockquote>
        <figcaption>記憶是成交之前的入口。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>凡事結果，必有路徑，必有原因。</blockquote>
        <figcaption>不要只羨慕結果，要拆解別人怎麼做到。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>好標題，讓內容先被看見；好名字，讓銷售先被認識。</blockquote>
        <figcaption>被看見，才有下一步互動。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>名字不是玄學，是低成本記憶設計。</blockquote>
        <figcaption>好的自我定位，本身就是成交槓桿。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>真正決定業績差距的，不是成交能力，而是客戶長期經營能力。</blockquote>
        <figcaption>一次成交靠技巧，長期業績靠系統。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="李偉彬">
        <blockquote>把有溫度的出現，變成一套可以長期執行的系統。</blockquote>
        <figcaption>高客經營需要節奏，不是想到才出現。</figcaption>
        <a class="src" href="notes/d6-01-liweibin.html">李偉彬｜認知突圍</a>
      </figure>
      <figure class="q" data-d="d2" data-s="于忠濱">
        <blockquote>你想帶領別人走得有多遠，你自己就得先到那裡。</blockquote>
        <figcaption>領導力不是要求別人，而是先活成證明。</figcaption>
        <a class="src" href="notes/d6-02-yuzhongbin.html">于忠濱｜長期主義</a>
      </figure>
      <figure class="q" data-d="d2" data-s="于忠濱">
        <blockquote>付出一定會感動別人，但一定要先感動自己。</blockquote>
        <figcaption>只有自己先相信，客戶和團隊才可能被感染。</figcaption>
        <a class="src" href="notes/d6-02-yuzhongbin.html">于忠濱｜長期主義</a>
      </figure>
      <figure class="q" data-d="d2" data-s="于忠濱">
        <blockquote>奇蹟就是看似不可能，實際可能。</blockquote>

        <figcaption>決勝在客戶的心智，不在報價單。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>在客戶的心裡，只記得「第一」和「不同」。</blockquote>
        <figcaption>一堆優點等於沒有優點。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>沒有進入用戶心智的努力，做得再好都是無效努力。</blockquote>
        <figcaption>別再當客戶的中轉站。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>有目標的人，把每一次「不」都算進達成的路徑。</blockquote>
        <figcaption>沒目標的人，被拒絕一次就懷疑人生。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>中低客群在比價，高客一直在尋找那個懂他的人。</blockquote>
        <figcaption>懂他，是最稀缺的能力。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>我有什麼？我要什麼？我要為此付出什麼？</blockquote>
        <figcaption>每一次轉型前的自我三問。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>高手都在高價值領域，持續做難而正確的事。</blockquote>
        <figcaption>想收穫長期利益，就要放棄眼前利益。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="趙楊">
        <blockquote>人無遠慮必有近憂——第一曲線穩定時，就要想好第二增長曲線。</blockquote>
        <figcaption>否則只剩四個字：疲於奔命。</figcaption>
        <a class="src" href="notes/d7-03-zhaoyang.html">趙楊｜績優與高客深度經營</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>創業沒學過財務、稅務、法務，等於無照駕駛。</blockquote>
        <figcaption>開車要先考科目一，創業更要先學財商。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>上行期買資產加槓桿，下行期投自己、投確定性。</blockquote>
        <figcaption>兩套週期，兩套打法，不能用反。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>高頻、剛需、海量——三個字看懂一門生意。</blockquote>
        <figcaption>再加上現金流和毛利率，就是完整的判斷。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>老客戶沒有流量成本。</blockquote>
        <figcaption>下行期，激活老客戶比砸錢拉新更重要。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>創業的開始是先有訂單，不是先開公司。</blockquote>
        <figcaption>他和稻盛和夫的第一家公司，設備全是二手的。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>情緒穩定，是發財的第一心法。</blockquote>
        <figcaption>要吵架前先問自己：捨得損失這筆錢嗎？</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
      <figure class="q" data-d="d3" data-s="齊昊">
        <blockquote>和氣生財，但要有邊界感——不卑不亢。</blockquote>
        <figcaption>和氣不等於當老好人。</figcaption>
        <a class="src" href="notes/d7-05-qihao.html">齊昊｜四個財務思維</a>
      </figure>
    </main>

  <script>
    const chips = document.querySelectorAll(".chip");
    const sp = document.getElementById("sp");
    const items = Array.from(document.querySelectorAll(".q"));
    const count = document.getElementById("count");
    let day = "all";
    const apply = () => {
      let n = 0;
      items.forEach((el) => {
        const ok = (day === "all" || el.dataset.d === day) && (sp.value === "all" || el.dataset.s === sp.value);
        el.classList.toggle("hide", !ok);
        if (ok) n++;
      });
      count.textContent = "顯示 " + n + " 句";
    };
    chips.forEach((c) => c.addEventListener("click", () => {
      chips.forEach((x) => x.classList.remove("on"));
      c.classList.add("on");
      day = c.dataset.f;
      apply();
    }));
    sp.addEventListener("change", apply);
    apply();
  </script>
