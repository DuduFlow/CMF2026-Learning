  <script>
    const chips = document.querySelectorAll(".chip");
    const sp = document.getElementById("sp");
    const items = Array.from(document.querySelectorAll(".q"));
    const count = document.getElementById("count");
    let day = "all";
    const FAVKEY = "cmf-quote-favs";
    let favs = new Set(JSON.parse(localStorage.getItem(FAVKEY) || "[]"));
    const apply = () => {
      let n = 0;
      items.forEach((el) => {
        const dayOk = day === "all" ? true : (day === "fav" ? favs.has(el.dataset.id) : el.dataset.d === day);
        const ok = dayOk && (sp.value === "all" || el.dataset.s === sp.value);
        el.classList.toggle("hide", !ok);
        if (ok) n++;
      });
      count.textContent = "顯示 " + n + " 句";
    };
    const toast = document.createElement("div");
    toast.className = "toast";
    document.body.appendChild(toast);
    let toastTimer;
    const say = (msg) => {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    };
    items.forEach((el) => {
      const id = el.dataset.id;
      const btn = el.querySelector(".fav");
      const sync = () => { btn.classList.toggle("on", favs.has(id)); btn.textContent = favs.has(id) ? "❤" : "♡"; };
      sync();
      btn.addEventListener("click", () => {
        if (favs.has(id)) favs.delete(id); else favs.add(id);
        localStorage.setItem(FAVKEY, JSON.stringify(Array.from(favs)));
        sync();
        say(favs.has(id) ? "已加入收藏" : "已移除收藏");
        if (day === "fav") apply();
      });
      const bq = el.querySelector("blockquote");
      bq.addEventListener("click", () => {
        const text = "「" + bq.textContent.trim() + "」\n——" + el.querySelector(".src").textContent.trim() + "｜CMF 2026";
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
          () => say("金句已複製，可直接貼上"),
          () => say("複製失敗，請長按選取")
        );
      });
    });
    chips.forEach((c) => c.addEventListener("click", () => {
      chips.forEach((x) => x.classList.remove("on"));
      c.classList.add("on");
      day = c.dataset.f;
      apply();
    }));
    sp.addEventListener("change", apply);
    apply();
  </script>
